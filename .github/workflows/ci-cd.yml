name: CI/CD Pipeline

on:
  push:
    branches: [preprod, prod]
  pull_request:
    branches: [preprod]

permissions:
  contents: read
  packages: write
  id-token: write  # Requis pour l'authentification GCP via Workload Identity

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: khaoulachaouaty/clinique-backend
  FRONTEND_IMAGE: khaoulachaouaty/clinique-frontend
  GKE_CLUSTER: clinique-cluster
  GKE_ZONE: europe-west1-b
  K8S_NAMESPACE: clinique

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend - Maven compile
        run: cd Clinique && mvn clean compile

      - name: Backend - Maven tests
        run: cd Clinique && mvn test -DskipTests

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend - Install dependencies
        run: cd clinique_frontend && npm ci

      - name: Frontend - Lint
        run: cd clinique_frontend && npm run lint --if-present

      - name: Frontend - Build
        run: cd clinique_frontend && npm run build

  # ─────────────────────────────────────────────
  # JOB 2 : Build & Push Docker images (prod only)
  # ─────────────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/prod'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Clinique
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./clinique_frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 3 : Deploy to GKE (prod only)
  # ─────────────────────────────────────────────
  deploy-gke:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Authentification GCP via Service Account Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Installer gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Configurer kubectl pour GKE
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # Appliquer les manifests Kubernetes
      - name: Apply K8s namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply MySQL secret
        run: kubectl apply -f k8s/mysql-secret.yaml

      - name: Apply MySQL deployment
        run: kubectl apply -f k8s/mysql-deployment.yaml

      - name: Wait for MySQL to be ready
        run: |
          kubectl rollout status deployment/mysql \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      - name: Apply Backend deployment
        run: kubectl apply -f k8s/backend-deployment.yaml

      # Forcer le rechargement de l'image latest
      - name: Rollout Backend with new image
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Apply Frontend deployment
        run: kubectl apply -f k8s/frontend-deployment.yaml

      - name: Rollout Frontend with new image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      # Afficher l'IP publique du frontend
      - name: Get Frontend external IP
        run: |
          echo "Waiting for LoadBalancer IP..."
          for i in {1..12}; do
            IP=$(kubectl get svc frontend -n ${{ env.K8S_NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "✅ Frontend accessible at: http://$IP"
              break
            fi
            echo "Attempt $i/12 - IP not yet assigned, waiting 10s..."
            sleep 10
          done

      - name: Deployment summary
        run: |
          echo "=== Deployment Summary ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
